name: Playwright quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APEX_BASE_URL: ${{ secrets.APEX_BASE_URL }}
      APEX_STEVE_USER: ${{ secrets.APEX_STEVE_USER }}
      APEX_STEVE_PASSWORD: ${{ secrets.APEX_STEVE_PASSWORD }}
      APEX_AMY_USER: ${{ secrets.APEX_AMY_USER }}
      APEX_AMY_PASSWORD: ${{ secrets.APEX_AMY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify required secrets
        run: |
          test -n "$APEX_BASE_URL"
          test -n "$APEX_STEVE_USER"
          test -n "$APEX_STEVE_PASSWORD"

      - name: Run Playwright tests
        run: npm test

      - name: Upload failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
